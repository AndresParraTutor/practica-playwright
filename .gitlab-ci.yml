stages:
  - test

playwright:
  stage: test
  image: mcr.microsoft.com/playwright:v1.64.1-noble
  timeout: 20m
  script:
    - node --version
    - npm ci
    - npx playwright test -c playwright.clase-10.config.ts
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - playwright-report/clase-10/
      - test-results/clase-10/
